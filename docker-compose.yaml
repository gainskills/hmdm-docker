services:

  # To use custom SSL certificates:
  # 1. Comment out the whole certbot: section
  # 2. Create the subdirectory ./volumes/letsencrypt/live/your-domain.com/
  # 3. Copy the private key, certificate, and full certificate chain
  # in the PEM (base64) format to that subdirectory. Use the following names:
  # cert.pem, fullchain.pem, privkey.pem
  #
  # To use plain HTTP:
  # 1. Comment out the certbot: section
  # 2. Uncomment the port 80 forwarding
  # 3. Set the environment variable in the .env file: PROTOCOL=http
  #
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - ./volumes/letsencrypt:/etc/letsencrypt
    ports:
      - 80:80
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM INT
        until certbot certonly --non-interactive --agree-tos --keep-until-expiring -m "${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}" --standalone -d "${BASE_DOMAIN:?Set BASE_DOMAIN in .env}"; do
          echo "Certificate issuance failed; retrying in 5 minutes"
          sleep 5m & wait $$!
        done
        while :; do
          sleep 12h & wait $$!
          if ! certbot renew --quiet; then
            echo "Certificate renewal failed; retrying in 12 hours" >&2
          fi
        done

  postgresql:
    # Existing deployments without POSTGRES_IMAGE remain on 12 so their data
    # directory is not opened by an incompatible major version.
    image: ${POSTGRES_IMAGE:-postgres:12-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SQL_USER:?Set SQL_USER in .env}
      POSTGRES_PASSWORD: ${SQL_PASS:?Set SQL_PASS in .env}
      POSTGRES_DB: ${SQL_BASE:?Set SQL_BASE in .env}
    volumes:
      - ./volumes/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER:?Set SQL_USER in .env} -d ${SQL_BASE:?Set SQL_BASE in .env}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hmdm:
    image: headwindmdm/hmdm:0.1.7
    restart: unless-stopped
    ports:
      # Uncomment this port forwarding if you want to use plain HTTP instead of HTTPS
      #- 80:8080
      - 443:8443
      - "${MQTT_PORT:-31000}:${MQTT_PORT:-31000}"
    # Reach the embedded MQTT broker locally using its TLS certificate hostname.
    extra_hosts:
      - "${BASE_DOMAIN:?Set BASE_DOMAIN in .env}:127.0.0.1"
    volumes:
      - ./volumes/work:/usr/local/tomcat/work
      - ./volumes/letsencrypt:/etc/letsencrypt:ro
      - ./volumes/hmdm-config:/usr/local/tomcat/conf/Catalina/localhost
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      # Database connection.
      SQL_HOST: postgresql
      SQL_BASE: ${SQL_BASE:?Set SQL_BASE in .env}
      SQL_USER: ${SQL_USER:?Set SQL_USER in .env}
      SQL_PASS: ${SQL_PASS:?Set SQL_PASS in .env}

      # Hostname used for certificates and application identity.
      BASE_DOMAIN: ${BASE_DOMAIN:?Set BASE_DOMAIN in .env}
      PROTOCOL: ${PROTOCOL:-https}
      # Public application URL; override for a different host, port or proxy URL.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-${PROTOCOL:-https}://${BASE_DOMAIN:?Set BASE_DOMAIN in .env}}

      # Certificate directory and whether to wait for Certbot-issued files.
      HTTPS_CERT_PATH: ${HTTPS_CERT_PATH:-/etc/letsencrypt/live/${BASE_DOMAIN:?Set BASE_DOMAIN in .env}}
      HTTPS_LETSENCRYPT: ${HTTPS_LETSENCRYPT:-true}

      # Application setup and deployment.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      SHARED_SECRET: ${SHARED_SECRET:?Set SHARED_SECRET in .env}
      HMDM_VARIANT: ${HMDM_VARIANT:-os}
      FORCE_RECONFIGURE: ${FORCE_RECONFIGURE:-false}
      # Explicitly set an empty value for public WAR downloads.
      DOWNLOAD_CREDENTIALS: ${DOWNLOAD_CREDENTIALS?Set DOWNLOAD_CREDENTIALS in .env (empty for public downloads)}
      # These have no entrypoint fallback; empty values override image defaults.
      HMDM_URL: ${HMDM_URL:?Set HMDM_URL in .env}
      HMDM_WAR_SHA256: ${HMDM_WAR_SHA256:-}
      CLIENT_VERSION: ${CLIENT_VERSION:?Set CLIENT_VERSION in .env}

      # Enrollment and optional IP address restrictions.
      SECURE_ENROLLMENT: ${SECURE_ENROLLMENT:-1}
      DEVICE_ALLOWED_ADDRESS: ${DEVICE_ALLOWED_ADDRESS:-}
      UI_ALLOWED_ADDRESS: ${UI_ALLOWED_ADDRESS:-}

      # Outgoing email.
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-0}
      SMTPSSL_VER: ${SMTPSSL_VER:-TLSv1.2}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-1}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}
      SMTP_FROM: ${SMTP_FROM:-${SMTP_USERNAME:?Set SMTP_USERNAME in .env}}

      # false uses HMDM's embedded broker; true uses an external broker.
      MQTT_EXTERNAL: ${MQTT_EXTERNAL:-false}
      # Embedded broker port, also used by the Docker port mapping above.
      MQTT_PORT: ${MQTT_PORT:-31000}
      # Embedded listener or external broker address; defaults to MQTT_PORT.
      MQTT_SERVER_URI: ${MQTT_SERVER_URI:-tcp://0.0.0.0:${MQTT_PORT:-31000}}
      MQTT_MSG_DELAY: ${MQTT_MSG_DELAY:-100}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?Set MQTT_ADMIN_PASSWORD in .env}

      # Login token secret and lifetimes in seconds.
      JWT_SECRETKEY: ${JWT_SECRETKEY:?Set JWT_SECRETKEY in .env}
      JWT_VALIDITY: ${JWT_VALIDITY:-86400}
      JWT_VALIDITYREMEMBERME: ${JWT_VALIDITYREMEMBERME:-2592000}
